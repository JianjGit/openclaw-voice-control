name: CI

on:
  push:
  pull_request:

jobs:
  windows-core:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify Python sources compile
        shell: pwsh
        run: python -m compileall -q src/openclaw_voice_control scripts tests examples

      - name: Run hardware-free core tests
        shell: pwsh
        run: python -m pytest -q
