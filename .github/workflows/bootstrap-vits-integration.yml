name: Bootstrap VITS integration

on:
  push:
    branches:
      - feat/classic-vits-tts

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/classic-vits-tts
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply VITS integration
        run: python tools/bootstrap_vits_integration.py
      - name: Syntax checks
        run: python -m compileall -q src scripts tests
      - name: Focused provider tests
        run: |
          python -m pip install -q PyYAML pytest
          PYTHONPATH=src python -m pytest -q tests/test_tts_provider.py
      - name: Commit generated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/bootstrap-vits-integration.yml tools/bootstrap_vits_integration.py
          git add -A
          git commit -m "Add optional classic multi-speaker VITS TTS backend"
          git push origin HEAD:feat/classic-vits-tts
