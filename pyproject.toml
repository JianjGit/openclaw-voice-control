[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openclaw-voice-control"
version = "0.1.0"
description = "Headless Windows voice core SDK and standalone service for OpenClaw."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "funasr>=1.2",
  "numpy>=1.26,<2",
  "openwakeword>=0.6.0",
  "PyYAML>=6.0",
  "sounddevice>=0.5",
  "websockets>=15.0",
  "torch>=2.2",
  "torchaudio>=2.2",
  "pywin32>=306; sys_platform == 'win32'",
]

[project.scripts]
openclaw-voice-control = "openclaw_voice_control.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
porcupine = [
  "pvporcupine>=3.0",
  "pvrecorder>=1.2",
]
tts-cli = [
  "comtypes>=1.4; sys_platform == 'win32'",
  "edge-tts>=6.1",
]
vits = [
  "scipy>=1.11",
  "Unidecode>=1.3",
  "pypinyin>=0.50",
  "jieba>=0.42",
  "cn2an>=0.5",
  "pyopenjtalk-prebuilt>=0.3.0",
  "setuptools>=77,<82",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
